name: Watch n8n releases

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/n8n-version-watch.yml
  schedule:
    - cron: "15 1 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish release
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compare n8n versions
        id: versions
        shell: bash
        run: |
          supported="$(node -p "require('./locales.json').locales[require('./locales.json').defaultLocale].n8nBaseline")"
          latest="$(npm view n8n version)"
          baselines="$(node -p "[...new Set(Object.values(require('./locales.json').locales).map((locale) => locale.n8nBaseline))].join(',')")"
          package_tag="v$(node -p "require('./package.json').version")"
          if [[ "$baselines" == "$latest" ]]; then
            all_locales_current=true
          else
            all_locales_current=false
          fi
          echo "supported=$supported" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "baselines=$baselines" >> "$GITHUB_OUTPUT"
          echo "package_tag=$package_tag" >> "$GITHUB_OUTPUT"
          echo "all_locales_current=$all_locales_current" >> "$GITHUB_OUTPUT"

      - name: Open maintenance issue
        if: steps.versions.outputs.latest != steps.versions.outputs.supported
        uses: actions/github-script@v7
        env:
          SUPPORTED_VERSION: ${{ steps.versions.outputs.supported }}
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
        with:
          script: |
            const title = `维护：适配 n8n ${process.env.LATEST_VERSION}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });

            if (issues.some((issue) => !issue.pull_request && issue.title === title)) {
              core.info(`Issue already exists: ${title}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              assignees: [context.repo.owner],
              body: [
                `npm 已发布 n8n ${process.env.LATEST_VERSION}。`,
                '',
                `当前完整适配基线：n8n ${process.env.SUPPORTED_VERSION}`,
                '',
                '维护检查：',
                '- [ ] 安装目标版本并生成英文资源快照',
                '- [ ] 审计新增或变化的界面文案',
                '- [ ] 更新并复核各已发布语言词典',
                '- [ ] 验证安装、卸载和工作流数据不受影响',
                '- [ ] 通过 macOS、Windows、Linux 自动测试',
                '- [ ] 发布新版本',
                '',
                '_此 Issue 由版本监控任务自动创建，同一 n8n 版本只创建一次。_',
              ].join('\n'),
            });

      - name: Close completed maintenance issue
        if: steps.versions.outputs.all_locales_current == 'true'
        uses: actions/github-script@v7
        env:
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
          PACKAGE_TAG: ${{ steps.versions.outputs.package_tag }}
        with:
          script: |
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.PACKAGE_TAG,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${process.env.PACKAGE_TAG} is not published yet; keeping the maintenance Issue open.`);
                return;
              }
              throw error;
            }

            if (release.draft || !release.published_at) {
              core.info(`Release ${process.env.PACKAGE_TAG} is not fully published; keeping the maintenance Issue open.`);
              return;
            }

            const title = `维护：适配 n8n ${process.env.LATEST_VERSION}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = issues.find((candidate) => !candidate.pull_request && candidate.title === title);
            if (!issue) {
              core.info(`No open maintenance Issue found: ${title}`);
              return;
            }

            const completedBody = (issue.body ?? '').replace(/^- \[ \]/gm, '- [x]');
            if (completedBody !== issue.body) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: completedBody,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                `已完成 n8n ${process.env.LATEST_VERSION} 适配。`,
                '',
                `发布版本：[${process.env.PACKAGE_TAG}](${release.html_url})`,
                '',
                '语言词典、安装/卸载回归及 macOS、Windows、Linux 自动测试已通过。',
                '',
                '_此 Issue 由版本监控任务自动关闭。_',
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed Issue #${issue.number}: ${title}`);
