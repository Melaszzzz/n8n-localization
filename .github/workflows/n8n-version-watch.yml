name: Watch n8n releases

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - locales.json
      - .github/workflows/n8n-version-watch.yml
  schedule:
    - cron: "15 1 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish release
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compare n8n versions
        id: versions
        shell: bash
        run: |
          supported="$(node -p "require('./locales.json').locales[require('./locales.json').defaultLocale].n8nBaseline")"
          latest="$(npm view n8n version)"
          min_baseline="$(node -p "[...Object.values(require('./locales.json').locales)].map((locale) => locale.n8nBaseline).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).at(0)")"
          package_tag="v$(node -p "require('./package.json').version")"
          echo "supported=$supported" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "min_baseline=$min_baseline" >> "$GITHUB_OUTPUT"
          echo "package_tag=$package_tag" >> "$GITHUB_OUTPUT"

      - name: Open maintenance issue
        if: steps.versions.outputs.latest != steps.versions.outputs.supported
        uses: actions/github-script@v7
        env:
          SUPPORTED_VERSION: ${{ steps.versions.outputs.supported }}
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
        with:
          script: |
            const title = `维护：适配 n8n ${process.env.LATEST_VERSION}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });

            if (issues.some((issue) => !issue.pull_request && issue.title === title)) {
              core.info(`Issue already exists: ${title}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              assignees: [context.repo.owner],
              body: [
                `npm 已发布 n8n ${process.env.LATEST_VERSION}。`,
                '',
                `当前完整适配基线：n8n ${process.env.SUPPORTED_VERSION}`,
                '',
                '维护检查：',
                '- [ ] 安装目标版本并生成英文资源快照',
                '- [ ] 审计新增或变化的界面文案',
                '- [ ] 更新并复核各已发布语言词典',
                '- [ ] 验证安装、卸载和工作流数据不受影响',
                '- [ ] 通过 macOS、Windows、Linux 自动测试',
                '- [ ] 发布新版本',
                '',
                '_此 Issue 由版本监控任务自动创建，同一 n8n 版本只创建一次。_',
              ].join('\n'),
            });

      - name: Close completed maintenance issue
        uses: actions/github-script@v7
        env:
          MIN_BASELINE: ${{ steps.versions.outputs.min_baseline }}
          PACKAGE_TAG: ${{ steps.versions.outputs.package_tag }}
        with:
          script: |
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.PACKAGE_TAG,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${process.env.PACKAGE_TAG} is not published yet; keeping the maintenance Issue open.`);
                return;
              }
              throw error;
            }

            if (release.draft || release.prerelease || !release.published_at) {
              core.info(`Release ${process.env.PACKAGE_TAG} is not fully published; keeping the maintenance Issue open.`);
              return;
            }

            const titlePattern = /^维护：适配 n8n (\d+\.\d+\.\d+)$/;
            const minimumBaseline = process.env.MIN_BASELINE.split('.').map(Number);
            const compareVersions = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            };
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const candidates = issues.filter((candidate) => {
              const match = !candidate.pull_request && candidate.title.match(titlePattern);
              return match && compareVersions(match[1].split('.').map(Number), minimumBaseline) <= 0;
            });
            if (candidates.length === 0) {
              core.info(`No open maintenance Issue found at or below n8n ${process.env.MIN_BASELINE}.`);
              return;
            }

            for (const issue of candidates) {
              const issueVersion = issue.title.match(titlePattern)[1];
              const sameBaseline = compareVersions(issueVersion.split('.').map(Number), minimumBaseline) === 0;
              if (sameBaseline) {
                const completedBody = (issue.body ?? '').replace(/^- \[ \]/gm, '- [x]');
                if (completedBody !== issue.body) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: completedBody,
                  });
                }
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: sameBaseline
                  ? [
                      `已完成 n8n ${issueVersion} 适配。`,
                      '',
                      `发布版本：[${process.env.PACKAGE_TAG}](${release.html_url})`,
                      '',
                      '语言词典、安装/卸载回归及 macOS、Windows、Linux 自动测试已通过。',
                      '',
                      '_此 Issue 由版本监控任务自动关闭。_',
                    ].join('\n')
                  : [
                      `n8n ${issueVersion} 的维护请求已被 n8n ${process.env.MIN_BASELINE} 基线覆盖。`,
                      '',
                      `发布版本：[${process.env.PACKAGE_TAG}](${release.html_url})`,
                      '',
                      '这是跳过中间版本后的关闭记录；未将该中间版本的检查清单标记为已完成。',
                      '',
                      '_此 Issue 由版本监控任务自动关闭。_',
                    ].join('\n'),
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed Issue #${issue.number}: 维护：适配 n8n ${issueVersion}`);
            }
